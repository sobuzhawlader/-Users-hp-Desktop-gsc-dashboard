[server]
headless = true
enableCORS = true
enableXsrfProtection = true
runOnSave = false
enableStaticServing = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#1a73e8"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f8f9fa"
textColor = "#202124"
font = "sans serif"

[client]
showErrorDetails = "full"
toolbarMode = "minimal"

